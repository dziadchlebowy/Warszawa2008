<script>
document.addEventListener("DOMContentLoaded", () => {

  const photos = Array.from(
    document.querySelectorAll(".photo img")
  );

  if (!photos.length) {
    return;
  }

  const lightbox = document.createElement("div");
  lightbox.className = "lightbox";

  lightbox.innerHTML = `
    <div class="lightbox__stage">

      <button
        class="lightbox__close"
        type="button"
        aria-label="Zamknij"
      >×</button>

      <div class="lightbox__counter"></div>

      <button
        class="lightbox__prev"
        type="button"
        aria-label="Poprzednie zdjęcie"
      >‹</button>

      <img class="lightbox__image is-current" alt="">

      <img class="lightbox__image" alt="">

      <button
        class="lightbox__next"
        type="button"
        aria-label="Następne zdjęcie"
      >›</button>

      <div class="lightbox__caption"></div>

    </div>
  `;

  document.body.appendChild(lightbox);

  const stage =
    lightbox.querySelector(".lightbox__stage");

  const closeButton =
    lightbox.querySelector(".lightbox__close");

  const prevButton =
    lightbox.querySelector(".lightbox__prev");

  const nextButton =
    lightbox.querySelector(".lightbox__next");

  const counter =
    lightbox.querySelector(".lightbox__counter");

  const caption =
    lightbox.querySelector(".lightbox__caption");

  let imageA =
    lightbox.querySelectorAll(".lightbox__image")[0];

  let imageB =
    lightbox.querySelectorAll(".lightbox__image")[1];

  let currentImage = imageA;
  let incomingImage = imageB;

  let currentIndex = 0;
  let isAnimating = false;

  let touchStartX = 0;
  let touchStartY = 0;


  /* =====================================================
     INFORMACJE O ZDJĘCIU
     ===================================================== */

  function getPhotoInfo(index) {

    const img = photos[index];

    const figure =
      img.closest("figure");

    const figcaption =
      figure?.querySelector("figcaption");

    return {
      src: img.currentSrc || img.src,
      alt: img.alt || "",
      caption: figcaption
        ? figcaption.textContent.trim()
        : img.alt || ""
    };
  }


  /* =====================================================
     WYŚWIETLENIE INFORMACJI
     ===================================================== */

  function updateInfo(index) {

    const info =
      getPhotoInfo(index);

    currentImage.src =
      info.src;

    currentImage.alt =
      info.alt;

    caption.textContent =
      info.caption;

    counter.textContent =
      `${index + 1} / ${photos.length}`;
  }


  /* =====================================================
     OTWARCIE
     ===================================================== */

  function openLightbox(index) {

    currentIndex = index;
    isAnimating = false;

    const info =
      getPhotoInfo(index);

    currentImage.src =
      info.src;

    currentImage.alt =
      info.alt;

    currentImage.className =
      "lightbox__image is-current";

    incomingImage.className =
      "lightbox__image";

    caption.textContent =
      info.caption;

    counter.textContent =
      `${index + 1} / ${photos.length}`;

    lightbox.classList.add("is-open");

    document.body.style.overflow =
      "hidden";
  }


  /* =====================================================
     ZAMKNIĘCIE
     ===================================================== */

  function closeLightbox() {

    lightbox.classList.remove("is-open");

    document.body.style.overflow =
      "";

    setTimeout(() => {

      currentImage.className =
        "lightbox__image is-current";

      incomingImage.className =
        "lightbox__image";

    }, 220);
  }


  /* =====================================================
     ZMIANA ZDJĘCIA
     direction:
       1  = następne
      -1  = poprzednie
     ===================================================== */

  function showPhoto(index, direction) {

    if (photos.length <= 1 || isAnimating) {
      return;
    }

    const newIndex =
      (index + photos.length) %
      photos.length;

    if (newIndex === currentIndex) {
      return;
    }

    isAnimating = true;

    const info =
      getPhotoInfo(newIndex);

    incomingImage.src =
      info.src;

    incomingImage.alt =
      info.alt;

    /*
     * Kierunek wejścia:
     *
     * następne -> z prawej
     * poprzednie -> z lewej
     */

    incomingImage.className =
      direction > 0
        ? "lightbox__image from-right"
        : "lightbox__image from-left";

    /*
     * Wymuszamy klatkę, żeby przeglądarka
     * zobaczyła pozycję początkową.
     */

    incomingImage.offsetWidth;

    requestAnimationFrame(() => {

      currentImage.classList.remove(
        "is-current"
      );

      currentImage.classList.add(
        direction > 0
          ? "to-left"
          : "to-right"
      );

      incomingImage.classList.remove(
        direction > 0
          ? "from-right"
          : "from-left"
      );

      incomingImage.classList.add(
        "is-current"
      );
    });

    caption.textContent =
      info.caption;

    counter.textContent =
      `${newIndex + 1} / ${photos.length}`;

    setTimeout(() => {

      const oldImage =
        currentImage;

      currentImage =
        incomingImage;

      incomingImage =
        oldImage;

      currentIndex =
        newIndex;

      currentImage.className =
        "lightbox__image is-current";

      incomingImage.className =
        "lightbox__image";

      isAnimating = false;

    }, 300);
  }


  /* =====================================================
     KLIKNIĘCIE W ZDJĘCIE
     ===================================================== */

  photos.forEach((photo, index) => {

    photo.addEventListener("click", () => {
      openLightbox(index);
    });

  });


  /* =====================================================
     PRZYCISKI
     ===================================================== */

  closeButton.addEventListener(
    "click",
    closeLightbox
  );

  prevButton.addEventListener(
    "click",
    () => showPhoto(
      currentIndex - 1,
      -1
    )
  );

  nextButton.addEventListener(
    "click",
    () => showPhoto(
      currentIndex + 1,
      1
    )
  );


  /* =====================================================
     KLIKNIĘCIE W TŁO
     ===================================================== */

  lightbox.addEventListener(
    "click",
    event => {

      if (event.target === lightbox) {
        closeLightbox();
      }

    }
  );


  /* =====================================================
     KLAWIATURA
     ===================================================== */

  document.addEventListener(
    "keydown",
    event => {

      if (!lightbox.classList.contains("is-open")) {
        return;
      }

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowLeft") {

        event.preventDefault();

        showPhoto(
          currentIndex - 1,
          -1
        );
      }

      if (event.key === "ArrowRight") {

        event.preventDefault();

        showPhoto(
          currentIndex + 1,
          1
        );
      }

    }
  );


  /* =====================================================
     SWIPE
     ===================================================== */

  stage.addEventListener(
    "touchstart",
    event => {

      if (!event.touches.length) {
        return;
      }

      touchStartX =
        event.touches[0].clientX;

      touchStartY =
        event.touches[0].clientY;

    },
    { passive: true }
  );


  stage.addEventListener(
    "touchend",
    event => {

      if (!event.changedTouches.length) {
        return;
      }

      const touch =
        event.changedTouches[0];

      const deltaX =
        touch.clientX - touchStartX;

      const deltaY =
        touch.clientY - touchStartY;

      /*
       * Musi być wyraźniejsze poziome
       * przesunięcie niż pionowe.
       */

      if (
        Math.abs(deltaX) < 50 ||
        Math.abs(deltaX) < Math.abs(deltaY)
      ) {
        return;
      }

      if (deltaX < 0) {

        // swipe w lewo -> następne
        showPhoto(
          currentIndex + 1,
          1
        );

      } else {

        // swipe w prawo -> poprzednie
        showPhoto(
          currentIndex - 1,
          -1
        );
      }

    },
    { passive: true }
  );

});
</script>
